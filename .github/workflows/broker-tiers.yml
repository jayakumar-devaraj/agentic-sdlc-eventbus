name: broker-tiers

# The integration and evaluation tiers, against a real broker.
#
# Nightly and on demand rather than on every pull request. They start a broker, pull a client
# image, and run containers in three network positions - and the platform's Actions allowance is
# the binding constraint. The cheap gates that catch most regressions run per PR in ci.yml.
#
# A change that touches the seam - the envelope, a listener, the register - should be run through
# this by hand before merge. `workflow_dispatch` is there for exactly that.
on:
  schedule:
    # 03:00 UTC. Nothing depends on the hour; it is off-peak for the shared runner pool.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  broker-tiers:
    name: real envelope, real broker, every caller position
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the broker extra
        run: pip install -e ".[dev,broker]"

      - name: Start broker
        run: docker compose up -d

      - name: Wait for healthy status
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' agentic-sdlc-eventbus || echo starting)"
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "broker never became healthy" >&2
          docker compose logs
          exit 1

      - name: Pull the client image once
        # The evaluation tier starts three of these. Pulling here keeps the image fetch out of
        # the per-test timeouts, where a slow pull would read as a connectivity failure.
        run: docker pull apache/kafka:4.1.2

      - name: Integration and evaluation tiers
        env:
          # The host position, which is where pytest itself runs. The container positions are
          # exercised by the evaluation tier starting its own containers.
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          # Turns "no broker reachable" from a skip into a failure. The fixtures skip by default
          # so the tiers stay runnable on a laptop with nothing started; here a skip would mean
          # this workflow proved nothing while reporting green, which is worse than failing.
          # Checked inside the run rather than by re-running and grepping for "skipped" - that
          # would pay for the whole suite twice to learn something the fixture already knows.
          EVENTBUS_REQUIRE_BROKER: "1"
        run: pytest -m "integration or evaluation" -v

      - name: Broker logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
