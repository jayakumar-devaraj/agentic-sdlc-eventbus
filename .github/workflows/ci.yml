name: ci

# WHY THERE IS NO `push: branches: [main]` TRIGGER.
#
# There was, and it doubled this repository's bill for nothing. Every `pull_request` run was
# followed by a `push main` run of the same length, because merging is what produced the push.
# GitHub runs pull-request checks against the MERGE RESULT rather than the branch tip, so the tree
# that lands on `main` is the tree the PR just tested - re-testing it is paying twice for one
# answer. The platform's Actions allowance ran out on 2026-08-30, and this was the largest single
# line item across every repository that has a workflow.
#
# **The gap that leaves, stated rather than hidden:** the merge result is only the merged tree if
# `main` has not moved between the check and the merge. Enable branch protection's *"Require
# branches to be up to date before merging"* to close it properly. This platform merges one PR at
# a time, so the window is already narrow, but a settings toggle is a better guarantee than a habit.
#
# `workflow_dispatch` is the escape hatch: run this on `main` by hand when that is actually wanted,
# instead of on every merge forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per pull request. A second push to the same branch cancels the run the first one started
# rather than paying for both to finish. The key falls back to `run_id` off a pull request, which
# is unique per run, so a manual `workflow_dispatch` is never cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege at the top, raised per job only where a job actually needs more. The default
# repository token scope is far wider than anything here needs: this workflow reads code and
# reports a status, and that is all.
permissions:
  contents: read

jobs:
  quality:
    name: lint, types, and the contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Every run installed this repository's dependencies cold, though they are pinned and
          # identical between runs. Caching them is free minutes back.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        # No `broker` extra. The unit and contract tiers must not need a Kafka client, and
        # installing one here would let a dependency on it creep in unnoticed.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Unit and contract tiers
        # Coverage is 100% over a small package. That is a weak signal and this repository says
        # so out loud - `--cov-report=term-missing` prints the statement count next to the
        # percentage so the number is never reported without its denominator (constitution,
        # Article IV). The verification that carries weight is in the broker tiers.
        run: |
          pytest -m "unit or contract" \
            --cov=agentic_events --cov-report=term-missing --cov-fail-under=100

      - name: The exported envelope schema matches the model
        # Without this, the model could change and the artifact three other repositories diff
        # against would silently stay behind.
        run: python scripts/export_schema.py --check

      - name: The README topic table matches the register
        run: python scripts/render_topic_table.py --check

      - name: Assert every mermaid diagram parses
        # "The diagrams render on GitHub" has broken three times, and every time the
        # repository looked fine locally while GitHub showed "Unable to render rich
        # display" to anyone browsing it. Parsing is cheap and catches the whole class
        # seen so far; rendering needs a headless browser and is not worth the fragility.
        #
        # Versions are pinned and lifecycle scripts are disabled. This step installs from the
        # network into a trusted CI context on every run; leaving it unpinned made the build
        # depend on whatever npm resolved that morning.
        run: |
          npm install --no-fund --no-audit --no-save --ignore-scripts \
            mermaid@11.4.1 jsdom@25.0.1
          node scripts/validate-mermaid.mjs

  compose-up-and-verify:
    name: broker starts and auto-creates
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Serialised behind the quality job purely to stop paying for a broker start-up when the
    # cheap checks have already failed. It costs the same minutes on a green run - the two jobs'
    # times add either way - and saves all of them on a red one. The price is wall-clock on a
    # passing run, which is the right trade while the allowance is the binding constraint.
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start broker
        run: docker compose up -d

      - name: Wait for healthy status
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' agentic-sdlc-eventbus || echo starting)"
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "broker never became healthy" >&2
          docker compose logs
          exit 1

      - name: Validate auto-create + topic listing
        # apache/kafka-native has no bundled kafka-*.sh CLI tools, so admin
        # operations run from a disposable full-tooling client container on
        # the same 'eventbus' network instead of `compose exec` into the broker.
        run: |
          docker run --rm --network eventbus apache/kafka:4.1.2 \
            /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
            --topic eventbus.test-autocreate.v1 --bootstrap-server broker:19092
          docker run --rm --network eventbus apache/kafka:4.1.2 \
            /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server broker:19092 \
            | grep -q "eventbus.test-autocreate.v1"

      - name: Tear down
        if: always()
        run: docker compose down -v
